title = "MUXARO Gitleaks Configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Official AWS SigV4 documentation example test vectors in SigV4 harness and audit docs"
condition = "AND"
paths = [
  '''^qa/harness/verify-r2-sigv4\.ts$''',
  '''^docs/repository/REPOSITORY_AUDIT\.md$''',
  '''^docs/repository/PUBLICATION_CHECKLIST\.md$''',
  '''^\.github/gitleaks\.toml$''',
]
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
]

[[allowlists]]
description = "Benign non-secret UI storage key and synthetic QA/unit test identifiers"
condition = "AND"
paths = [
  '''^apps/web/lib/analytics\.ts$''',
  '''^packages/entitlements/tests/idempotency\.test\.ts$''',
  '''^tests/unit/entitlements\.test\.ts$''',
  '''^qa/harness/verify-account-platform\.mjs$''',
  '''^\.github/gitleaks\.toml$''',
]
regexes = [
  '''muxaro-consent-v2''',
  '''idem-req-uuid-12345''',
  '''idem_key_unique_12345''',
  '''Argon2id/Scrypt''',
  '''eyJhbGciOiJIUzI1NiJ9\.abc\.def''',
]

[[allowlists]]
description = "Synthetic test vectors and sample comments for PO token tests"
condition = "AND"
paths = [
  '''^apps/api/tests/po-token-cookie\.test\.ts$''',
  '''^apps/api/src/services/po-token-cookie\.service\.ts$''',
]
regexes = [
  '''ABC123XYZ''',
  '''sample_token''',
]
