name: IndexNow Search Engine Ingestion

on:
  schedule:
    # Trigger daily at midnight UTC to refresh search engine index queues
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      custom_url:
        description: 'Specific URL to submit (leave empty for full site crawl)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  submit-indexnow:
    name: Dispatch URLs to IndexNow (Bing, Yandex, Naver, Seznam)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run IndexNow Submission Script
        env:
          INDEXNOW_KEY: "d3e24b7a95614917a1518f97a8929e01"
          INDEXNOW_HOST: "muxaro.app"
        run: |
          if [ -n "${{ github.event.inputs.custom_url }}" ]; then
            node scripts/submit-indexnow.mjs "${{ github.event.inputs.custom_url }}"
          else
            node scripts/submit-indexnow.mjs
          fi
