name: Deploy Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or tag to deploy (defaults to main)"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  GCP_REGION: "us-central1"
  CLOUDFLARE_PROJECT_NAME: "muxaro"
  PRODUCTION_SITE_URL: "https://muxaro.app"
  PRODUCTION_API_URL: "https://api.muxaro.app"

jobs:
  deploy-production:
    name: Deploy Production (Protected Environment)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://muxaro.app
    permissions:
      contents: read
      id-token: write
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Check production deployment credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GCP_WIF: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GCP_PROJ: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "cloudflare=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare production secrets not configured in 'production' environment. Skipping Cloudflare Pages deploy."
          fi
          if [ -n "$GCP_WIF" ] && [ -n "$GCP_SA" ] && [ -n "$GCP_PROJ" ]; then
            echo "gcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "gcp=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP Workload Identity Federation secrets not configured in 'production' environment. Skipping Cloud Run deploy."
          fi

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Build Production Cloudflare Pages Bundle
        working-directory: apps/web
        env:
          CLOUDFLARE_PAGES: "1"
          NEXT_PUBLIC_SITE_URL: ${{ vars.PRODUCTION_SITE_URL || env.PRODUCTION_SITE_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.PRODUCTION_API_URL || env.PRODUCTION_API_URL }}
        run: npx next build

      - name: Verify production static bundle hygiene
        run: |
          test -f apps/web/out/index.html
          test -f apps/web/out/robots.txt
          test -f apps/web/out/sitemap.xml
          test -f apps/web/out/_headers
          test -f apps/web/out/_redirects
          if grep -rnE "localhost:3000|localhost:4000|127\.0\.0\.1:4000" apps/web/out/; then
            echo "::error::Hardcoded localhost URL leaked into production static export!"
            exit 1
          fi

      - name: Deploy Production Frontend to Cloudflare Pages
        if: steps.creds.outputs.cloudflare == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/out --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=main

      - name: Authenticate to Google Cloud via OIDC (Workload Identity Federation)
        if: steps.creds.outputs.gcp == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        if: steps.creds.outputs.gcp == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build, Push & Deploy Cloud Run API and Internal Media Worker
        if: steps.creds.outputs.gcp == 'true'
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

          API_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/muxaro/muxaro-api:${IMAGE_TAG}"
          WORKER_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/muxaro/muxaro-worker:${IMAGE_TAG}"

          docker build -f infra/Dockerfile.api -t "${API_IMAGE}" .
          docker push "${API_IMAGE}"

          docker build -f infra/Dockerfile.worker -t "${WORKER_IMAGE}" .
          docker push "${WORKER_IMAGE}"

          sed -e "s|REGION|${GCP_REGION}|g" \
              -e "s|PROJECT_ID|${GCP_PROJECT_ID}|g" \
              -e "s|IMAGE_TAG|${IMAGE_TAG}|g" \
              infra/cloudrun/api-service.yaml > /tmp/api-service.resolved.yaml

          sed -e "s|REGION|${GCP_REGION}|g" \
              -e "s|PROJECT_ID|${GCP_PROJECT_ID}|g" \
              -e "s|IMAGE_TAG|${IMAGE_TAG}|g" \
              infra/cloudrun/worker-service.yaml > /tmp/worker-service.resolved.yaml

          gcloud run services replace /tmp/api-service.resolved.yaml \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}"

          gcloud run services replace /tmp/worker-service.resolved.yaml \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}"

      - name: Post-Deploy Production Health Verification
        if: steps.creds.outputs.cloudflare == 'true' && steps.creds.outputs.gcp == 'true'
        env:
          SITE_URL: ${{ vars.PRODUCTION_SITE_URL || env.PRODUCTION_SITE_URL }}
          API_URL: ${{ vars.PRODUCTION_API_URL || env.PRODUCTION_API_URL }}
        run: |
          curl -fsS "${API_URL}/api/v1/health"
          curl -fsS "${API_URL}/api/v1/ready"
          curl -fsSI "${SITE_URL}/" | head -n 1 | grep -q "200"
          echo "Production health & readiness verification passed."

      - name: Trigger IndexNow Search Ingestion Automation
        env:
          INDEXNOW_KEY: "d3e24b7a95614917a1518f97a8929e01"
          INDEXNOW_HOST: "muxaro.app"
        run: node scripts/submit-indexnow.mjs
