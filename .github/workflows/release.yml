name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package and publish (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PRODUCTION_SITE_URL: "https://muxaro.vercel.app"

jobs:
  release:
    name: Build, Attest & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::Invalid SemVer release tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if echo "$TAG" | grep -q '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release API URL variable (if configured)
        env:
          PROD_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          if [ -n "$PROD_API_URL" ] && echo "$PROD_API_URL" | grep -qiE "api\.muxaro\.app|muxaro-api\.internal"; then
            echo "::error::vars.PRODUCTION_API_URL cannot use dead/unresolvable host ($PROD_API_URL)."
            exit 1
          fi

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies across build targets
        run: |
          npm --prefix apps/web ci --no-audit --no-fund
          npm --prefix apps/api ci --no-audit --no-fund
          npm --prefix apps/media-worker install --no-audit --no-fund
          npm --prefix packages/entitlements ci --no-audit --no-fund
          npm --prefix packages/source-adapters install --no-audit --no-fund

      - name: TypeCheck & Build release artifacts
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.PRODUCTION_SITE_URL || env.PRODUCTION_SITE_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.PRODUCTION_API_URL || '' }}
        run: |
          npm --prefix packages/entitlements run typecheck
          npm --prefix packages/source-adapters run typecheck
          npm --prefix apps/api run typecheck
          npm --prefix apps/media-worker run build
          (cd apps/web && npm run lint && npx next build)

      - name: Package release tarballs
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p release-artifacts
          tar -czf "release-artifacts/muxaro-web-next-${TAG}.tar.gz" -C apps/web .next public package.json next.config.mjs
          tar -czf "release-artifacts/muxaro-media-worker-${TAG}.tar.gz" \
            -C apps/media-worker dist package.json

      - name: Generate SPDX Software Bill of Materials (SBOM)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: "."
          format: "spdx-json"
          output-file: "release-artifacts/muxaro-${{ steps.meta.outputs.tag }}.spdx.json"
          upload-artifact: true
          artifact-name: "muxaro-${{ steps.meta.outputs.tag }}-sbom"
          upload-release-assets: false

      - name: Generate SHA-256 Checksums
        run: |
          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)
          cat release-artifacts/SHA256SUMS.txt

      - name: Attest Build Provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-artifacts/*.tar.gz
            release-artifacts/*.spdx.json
            release-artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "MUXARO ${{ steps.meta.outputs.tag }}"
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/muxaro-web-next-${{ steps.meta.outputs.tag }}.tar.gz
            release-artifacts/muxaro-media-worker-${{ steps.meta.outputs.tag }}.tar.gz
            release-artifacts/muxaro-${{ steps.meta.outputs.tag }}.spdx.json
            release-artifacts/SHA256SUMS.txt
