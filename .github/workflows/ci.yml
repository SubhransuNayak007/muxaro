name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  typecheck-and-lint:
    name: TypeCheck, Lint & Intent Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Workspace Dependencies
        run: |
          npm --prefix apps/web ci --no-audit --no-fund
          npm --prefix apps/desktop ci --no-audit --no-fund
          npm --prefix apps/api ci --no-audit --no-fund
          npm --prefix apps/media-worker install --no-audit --no-fund
          npm --prefix packages/shared install --no-audit --no-fund
          npm --prefix packages/db install --no-audit --no-fund
          npm --prefix packages/entitlements ci --no-audit --no-fund
          npm --prefix packages/source-adapters install --no-audit --no-fund

      - name: Lint & TypeCheck Web (apps/web)
        working-directory: apps/web
        run: npm run lint

      - name: Run Offline AI & Intent Engine Tests
        working-directory: apps/web
        run: node --test lib/ai/__tests__/intent-engine.test.mjs

      - name: TypeCheck Desktop (apps/desktop)
        working-directory: apps/desktop
        run: npm run build:ts

      - name: TypeCheck API & Media Worker
        run: |
          npm --prefix apps/api run typecheck
          npm --prefix apps/media-worker run build

      - name: Build Shared Packages
        run: |
          npm --prefix packages/shared run build
          npm --prefix packages/db run build
          npm --prefix packages/entitlements run build
          npm --prefix packages/source-adapters run build

      - name: Verify UI & Security Invariants
        run: |
          if grep -rnE "transition:\s*all" apps/web/app apps/web/components; then
            echo "::error::Forbidden 'transition: all' detected in UI source."
            exit 1
          fi
          if grep -rnE "C:\\\\Users\\\\" apps/web/app apps/web/components apps/web/lib apps/desktop/src apps/api/src; then
            echo "::error::Hardcoded developer Windows C:\\Users\\ path detected in source code!"
            exit 1
          fi
          echo "All UI, TypeScript & portability invariants passed."

  package-and-security-tests:
    name: Security & Package Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Package Dependencies
        run: |
          npm --prefix packages/entitlements ci --no-audit --no-fund
          npm --prefix packages/source-adapters install --no-audit --no-fund
          npm --prefix apps/media-worker install --no-audit --no-fund

      - name: Install FFmpeg for Media Worker Tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run Security Module Tests
        run: |
          node --experimental-strip-types security/tests/ssrf.test.ts
          node --experimental-strip-types security/tests/ffmpeg-sanitizer.test.ts
          node --experimental-strip-types security/tests/rate-limiter.test.ts
          node --experimental-strip-types security/tests/validation.test.ts

      - name: Run Package & Worker Tests
        run: |
          npm --prefix packages/entitlements test
          npm --prefix packages/source-adapters test
          npm --prefix apps/media-worker run build
          npm --prefix apps/media-worker test

  build-static-web:
    name: Build Static Production Web Bundle
    runs-on: ubuntu-latest
    needs:
      - typecheck-and-lint
      - package-and-security-tests
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Web Dependencies & Export Static App
        working-directory: apps/web
        env:
          STATIC_EXPORT: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -d out
