name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      deploy_legacy_cloudflare_pages:
        description: "Deploy optional legacy Cloudflare Pages staging preview"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  CLOUDFLARE_PROJECT_NAME: "muxaro"
  STAGING_SITE_URL: "https://muxaro.vercel.app"

jobs:
  deploy-staging:
    name: Validate & Deploy Staging (Vercel / Optional Legacy CF Pages)
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.cf_staging.outputs.deployment-url || vars.STAGING_SITE_URL || env.STAGING_SITE_URL }}
    permissions:
      contents: read
      id-token: write
      deployments: write
    outputs:
      staging_url: ${{ steps.cf_staging.outputs.deployment-url || vars.STAGING_SITE_URL || env.STAGING_SITE_URL }}
      deployed: ${{ steps.creds.outputs.cloudflare }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check staging deployment credentials & variables
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_API: ${{ vars.STAGING_API_URL }}
          LEGACY_CF: ${{ inputs.deploy_legacy_cloudflare_pages }}
        run: |
          if [ -n "$STAGING_API" ] && echo "$STAGING_API" | grep -qiE "api\.muxaro\.app|muxaro-api\.internal"; then
            echo "::error::vars.STAGING_API_URL cannot use dead/unresolvable host ($STAGING_API)."
            exit 1
          fi
          if [ "$LEGACY_CF" = "true" ] && [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            if [ -z "$STAGING_API" ]; then
              echo "::error::vars.STAGING_API_URL is required when deploying staging."
              exit 1
            fi
            echo "cloudflare=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging live upload skipped (Vercel handles preview deployments; set deploy_legacy_cloudflare_pages=true with CF secrets + vars.STAGING_API_URL for legacy CF Pages)."
          fi

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install & Lint Web dependencies
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run lint

      - name: Build Next.js bundle for staging verification
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.STAGING_SITE_URL || env.STAGING_SITE_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.STAGING_API_URL || '' }}
        run: npx next build

      - name: Verify Next.js staging bundle hygiene
        run: |
          test -d apps/web/.next
          if grep -rnE "localhost:3000|localhost:4000|127\.0\.0\.1:4000" apps/web/.next/static/; then
            echo "::error::Localhost URL leaked into staging build!"
            exit 1
          fi

      - name: Optional Legacy Static Export & Deploy to Cloudflare Pages
        id: cf_staging
        if: steps.creds.outputs.cloudflare == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_PAGES: "1"
          NEXT_PUBLIC_SITE_URL: ${{ vars.STAGING_SITE_URL || env.STAGING_SITE_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.STAGING_API_URL }}
        run: npx next build

      - name: Upload Legacy Staging Preview to Cloudflare Pages
        if: steps.creds.outputs.cloudflare == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/out --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=staging

  staging-smoke-tests:
    name: Staging Smoke Verification
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: needs.deploy-staging.outputs.deployed == 'true' && needs.deploy-staging.outputs.staging_url != ''
    permissions:
      contents: read
    steps:
      - name: Verify HTTP 200, Security Headers & SEO Controls
        env:
          STAGING_URL: ${{ needs.deploy-staging.outputs.staging_url }}
        run: |
          curl -fsSI "${STAGING_URL}/" | grep -qi "x-content-type-options: nosniff"
          curl -fsS "${STAGING_URL}/robots.txt" | grep -q "Disallow: /admin"
          curl -fsS "${STAGING_URL}/sitemap.xml" | grep -q "muxaro"
          curl -fsS "${STAGING_URL}/login" | grep -qi "noindex"
          echo "Staging smoke verification passed."
