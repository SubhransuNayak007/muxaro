<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" width="1120" height="390" fill="none" role="img" aria-label="MUXARO Media Processing Pipeline Diagram">
  <title>MUXARO Media Processing Pipeline</title>
  <defs>
    <linearGradient id="pipe-top" x1="0" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#695BFF"/>
      <stop offset="50%" stop-color="#4677FF"/>
      <stop offset="100%" stop-color="#36D6D1"/>
    </linearGradient>
    <marker id="pipe-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L10 5 L0 9 Z" fill="#36D6D1"/>
    </marker>
  </defs>

  <rect width="1120" height="390" rx="16" fill="#0A0D14"/>
  <rect x="0.75" y="0.75" width="1118.5" height="388.5" rx="15.25" stroke="#23293D" stroke-width="1.5"/>
  <rect x="24" y="0" width="1072" height="3" rx="1.5" fill="url(#pipe-top)"/>

  <text x="36" y="42" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700">MUXARO Media Processing Pipeline</text>
  <text x="36" y="64" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="12.5">End-to-end stream inspection, TurboFlow lane selection, sanitized FFmpeg execution, verification, and ephemeral delivery</text>

  <!-- Stage 1 -->
  <rect x="36" y="96" width="194" height="176" rx="10" fill="#111520" stroke="#695BFF" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="52" y="120" fill="#A59BFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">01 · INGEST</text>
  <text x="52" y="146" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="13.5" font-weight="600">Media Input</text>
  <text x="52" y="168" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Permitted URL Inspection</text>
  <text x="52" y="186" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Direct Stream Upload</text>
  <text x="52" y="204" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Resumable Multipart</text>
  <text x="52" y="222" fill="#7887A2" font-family="'JetBrains Mono', monospace" font-size="10">Up to 2 GB · Zero-RAM Stream</text>
  <text x="52" y="252" fill="#36D6D1" font-family="'JetBrains Mono', monospace" font-size="10">SSRF + Rights Guard</text>

  <line x1="230" y1="184" x2="252" y2="184" stroke="#36D6D1" stroke-width="2" marker-end="url(#pipe-arrow)"/>

  <!-- Stage 2 -->
  <rect x="256" y="96" width="194" height="176" rx="10" fill="#111520" stroke="#2D354F" stroke-width="1.5"/>
  <text x="272" y="120" fill="#A59BFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">02 · PROBE</text>
  <text x="272" y="146" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="13.5" font-weight="600">FFprobe Analysis</text>
  <text x="272" y="168" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Genuine Resolutions Only</text>
  <text x="272" y="186" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Video &amp; Audio Codecs</text>
  <text x="272" y="204" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Bitrate, FPS &amp; Duration</text>
  <text x="272" y="222" fill="#7887A2" font-family="'JetBrains Mono', monospace" font-size="10">-protocol_whitelist file,data</text>
  <text x="272" y="252" fill="#36D6D1" font-family="'JetBrains Mono', monospace" font-size="10">No Fake Upscaling</text>

  <line x1="450" y1="184" x2="472" y2="184" stroke="#36D6D1" stroke-width="2" marker-end="url(#pipe-arrow)"/>

  <!-- Stage 3 -->
  <rect x="476" y="96" width="194" height="176" rx="10" fill="#111520" stroke="#4677FF" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="492" y="120" fill="#A59BFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">03 · ROUTE</text>
  <text x="492" y="146" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="13.5" font-weight="600">TurboFlow Queue</text>
  <text x="492" y="168" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Instant Lane (Stream Copy)</text>
  <text x="492" y="186" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Smart Lane (Transcode)</text>
  <text x="492" y="204" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Power Lane (4K / Batch)</text>
  <text x="492" y="222" fill="#7887A2" font-family="'JetBrains Mono', monospace" font-size="10">6 Classes · Atomic Quota Hold</text>
  <text x="492" y="252" fill="#36D6D1" font-family="'JetBrains Mono', monospace" font-size="10">3-Tier Fair Scheduler</text>

  <line x1="670" y1="184" x2="692" y2="184" stroke="#36D6D1" stroke-width="2" marker-end="url(#pipe-arrow)"/>

  <!-- Stage 4 -->
  <rect x="696" y="96" width="194" height="176" rx="10" fill="#111520" stroke="#2D354F" stroke-width="1.5"/>
  <text x="712" y="120" fill="#A59BFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">04 · EXECUTE</text>
  <text x="712" y="146" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="13.5" font-weight="600">FFmpeg Engine</text>
  <text x="712" y="168" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Remux (-c copy) Preferred</text>
  <text x="712" y="186" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• MP4 / MKV / WebM Encode</text>
  <text x="712" y="204" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• MP3 / M4A / FLAC / WAV / Opus</text>
  <text x="712" y="222" fill="#7887A2" font-family="'JetBrains Mono', monospace" font-size="10">A/V Merge + Batch ZIP Archive</text>
  <text x="712" y="252" fill="#36D6D1" font-family="'JetBrains Mono', monospace" font-size="10">Live SSE Progress Events</text>

  <line x1="890" y1="184" x2="912" y2="184" stroke="#36D6D1" stroke-width="2" marker-end="url(#pipe-arrow)"/>

  <!-- Stage 5 -->
  <rect x="916" y="96" width="168" height="176" rx="10" fill="#111520" stroke="#10B981" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="932" y="120" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">05 · DELIVER</text>
  <text x="932" y="146" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="13.5" font-weight="600">Verify &amp; Serve</text>
  <text x="932" y="168" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• FFprobe Integrity</text>
  <text x="932" y="186" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• SHA-256 Checksum</text>
  <text x="932" y="204" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Signed Token URL</text>
  <text x="932" y="222" fill="#7887A2" font-family="'JetBrains Mono', monospace" font-size="10">HTTP Range Support</text>
  <text x="932" y="252" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10">60-min Auto-Delete</text>

  <!-- Job Lifecycle State Strip -->
  <rect x="36" y="296" width="1048" height="68" rx="10" fill="#111520" stroke="#23293D"/>
  <text x="54" y="320" fill="#9AA8BE" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">JOB LIFECYCLE STATES</text>

  <g font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">
    <rect x="54" y="330" width="88" height="24" rx="6" fill="#181D2C" stroke="#2D354F"/>
    <text x="98" y="346" text-anchor="middle" fill="#9AA8BE">CREATED</text>

    <rect x="164" y="330" width="104" height="24" rx="6" fill="#181D2C" stroke="#2D354F"/>
    <text x="216" y="346" text-anchor="middle" fill="#9AA8BE">VALIDATING</text>

    <rect x="290" y="330" width="88" height="24" rx="6" fill="#181D2C" stroke="#695BFF"/>
    <text x="334" y="346" text-anchor="middle" fill="#A59BFF">QUEUED</text>

    <rect x="400" y="330" width="108" height="24" rx="6" fill="#181D2C" stroke="#4677FF"/>
    <text x="454" y="346" text-anchor="middle" fill="#7EA3FF">PROCESSING</text>

    <rect x="530" y="330" width="100" height="24" rx="6" fill="#181D2C" stroke="#36D6D1"/>
    <text x="580" y="346" text-anchor="middle" fill="#36D6D1">VERIFYING</text>

    <rect x="652" y="330" width="88" height="24" rx="6" fill="#10B981" fill-opacity="0.16" stroke="#10B981"/>
    <text x="696" y="346" text-anchor="middle" fill="#10B981">READY</text>

    <rect x="780" y="330" width="286" height="24" rx="6" fill="#EF4444" fill-opacity="0.1" stroke="#EF4444" stroke-opacity="0.5"/>
    <text x="923" y="346" text-anchor="middle" fill="#F87171">FAILED / CANCELLED / REJECTED (Refund)</text>
  </g>
</svg>
