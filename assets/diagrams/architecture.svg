<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" fill="none" role="img" aria-label="MUXARO System Architecture Diagram">
  <title>MUXARO System Architecture</title>
  <defs>
    <linearGradient id="arch-brand" x1="0" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#695BFF"/>
      <stop offset="50%" stop-color="#4677FF"/>
      <stop offset="100%" stop-color="#36D6D1"/>
    </linearGradient>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 Z" fill="#36D6D1"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 Z" fill="#695BFF"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 Z" fill="#9AA8BE"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1120" height="620" rx="16" fill="#0A0D14"/>
  <rect x="0.75" y="0.75" width="1118.5" height="618.5" rx="15.25" stroke="#23293D" stroke-width="1.5"/>
  <rect x="24" y="0" width="1072" height="3" rx="1.5" fill="url(#arch-brand)"/>

  <!-- Header -->
  <text x="36" y="42" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700">MUXARO System Architecture</text>
  <text x="36" y="64" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="12.5">Monorepo workspace: Next.js 14 Web · Fastify 5 API · FFmpeg Media Worker · SQLite WAL / PostgreSQL · Cloudflare R2</text>

  <!-- Layer 1: Client & Web App -->
  <rect x="36" y="92" width="236" height="492" rx="12" fill="#111520" stroke="#23293D" stroke-width="1.5"/>
  <rect x="36" y="92" width="236" height="36" rx="12" fill="#181D2C"/>
  <rect x="36" y="116" width="236" height="12" fill="#181D2C"/>
  <text x="52" y="115" fill="#36D6D1" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">CLIENT &amp; WEB · apps/web</text>

  <rect x="52" y="144" width="204" height="86" rx="8" fill="#181D2C" stroke="#2D354F"/>
  <text x="66" y="168" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="13.5" font-weight="600">Next.js 14 App Router</text>
  <text x="66" y="188" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.5">React 18 · Tailwind CSS</text>
  <text x="66" y="205" fill="#9AA8BE" font-family="'JetBrains Mono', monospace" font-size="10.5">Port 3000 / Cloudflare Pages</text>
  <text x="66" y="220" fill="#36D6D1" font-family="'JetBrains Mono', monospace" font-size="10">/api/v1/* proxy rewrites</text>

  <rect x="52" y="246" width="204" height="106" rx="8" fill="#181D2C" stroke="#2D354F"/>
  <text x="66" y="270" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600">Workspace UI Surfaces</text>
  <text x="66" y="290" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.5">• Media Inspector &amp; Uploader</text>
  <text x="66" y="308" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.5">• Tools (Convert, Extract, Merge)</text>
  <text x="66" y="326" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.5">• My Downloads &amp; Batch Queue</text>
  <text x="66" y="344" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.5">• Usage, Account &amp; Admin Panel</text>

  <rect x="52" y="368" width="204" height="96" rx="8" fill="#181D2C" stroke="#2D354F"/>
  <text x="66" y="392" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600">Real-Time Delivery</text>
  <text x="66" y="412" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.5">• Server-Sent Events (SSE)</text>
  <text x="66" y="430" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.5">• Resumable Multipart Upload</text>
  <text x="66" y="448" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.5">• Signed HTTP Range Downloads</text>

  <rect x="52" y="480" width="204" height="86" rx="8" fill="#181D2C" stroke="#2D354F"/>
  <text x="66" y="504" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600">Security Controls</text>
  <text x="66" y="524" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.5">• HttpOnly Session Cookies</text>
  <text x="66" y="542" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.5">• x-muxaro-csrf + Consent v2</text>

  <!-- Layer 2: API Control Plane -->
  <rect x="316" y="92" width="424" height="492" rx="12" fill="#111520" stroke="#695BFF" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="316" y="92" width="424" height="36" rx="12" fill="#181D2C"/>
  <rect x="316" y="116" width="424" height="12" fill="#181D2C"/>
  <text x="332" y="115" fill="#A59BFF" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">API CONTROL PLANE · apps/api (Fastify 5 · Port 4000)</text>

  <!-- API Boxes Grid -->
  <rect x="332" y="144" width="188" height="96" rx="8" fill="#181D2C" stroke="#2D354F"/>
  <text x="346" y="168" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600">Auth &amp; Identity</text>
  <text x="346" y="187" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Email/Pass + Verification</text>
  <text x="346" y="204" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Google OAuth 2.0 + PKCE</text>
  <text x="346" y="221" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• RFC 6238 TOTP Admin MFA</text>

  <rect x="536" y="144" width="188" height="96" rx="8" fill="#181D2C" stroke="#2D354F"/>
  <text x="550" y="168" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600">Entitlements &amp; Quotas</text>
  <text x="550" y="187" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Rolling 24h Reservations</text>
  <text x="550" y="204" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Immutable Credit Ledger</text>
  <text x="550" y="221" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• GAM SSV Reward Credits</text>

  <rect x="332" y="256" width="188" height="96" rx="8" fill="#181D2C" stroke="#2D354F"/>
  <text x="346" y="280" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600">Security &amp; Rate Guard</text>
  <text x="346" y="299" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• SSRF DNS/IP Guard</text>
  <text x="346" y="316" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Multi-Layer Rate Limiter</text>
  <text x="346" y="333" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Signed Download Tokens</text>

  <rect x="536" y="256" width="188" height="96" rx="8" fill="#181D2C" stroke="#2D354F"/>
  <text x="550" y="280" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600">Source Adapters</text>
  <text x="550" y="299" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Direct HTTP Media Probe</text>
  <text x="550" y="316" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Permitted URL Adapters</text>
  <text x="550" y="333" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Rights Attestation Checks</text>

  <!-- TurboFlow Queue Box -->
  <rect x="332" y="368" width="392" height="114" rx="8" fill="#141928" stroke="#4677FF" stroke-width="1.25"/>
  <text x="348" y="392" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="13.5" font-weight="600">TurboFlow 6-Class · 3-Tier Priority Queue</text>
  <text x="348" y="412" fill="#36D6D1" font-family="'JetBrains Mono', monospace" font-size="10.5">PREMIUM (w=6) &gt; REGISTERED (w=3) &gt; GUEST (w=1) + Anti-Starvation Aging</text>
  <text x="348" y="434" fill="#9AA8BE" font-family="'JetBrains Mono', monospace" font-size="10.5">instant-processing (4) · audio-processing (4) · merge-processing (2)</text>
  <text x="348" y="452" fill="#9AA8BE" font-family="'JetBrains Mono', monospace" font-size="10.5">video-transcoding (2)  · high-resolution (1)  · playlist-packaging (1)</text>
  <text x="348" y="471" fill="#7887A2" font-family="'Inter', system-ui, sans-serif" font-size="11">SSE Progress Stream · Batch MXB / Job MXJ Tracking · Idempotency Keys</text>

  <!-- Shared Packages Strip -->
  <rect x="332" y="498" width="392" height="68" rx="8" fill="#181D2C" stroke="#2D354F"/>
  <text x="348" y="520" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="12.5" font-weight="600">Shared Internal Packages</text>
  <text x="348" y="540" fill="#9AA8BE" font-family="'JetBrains Mono', monospace" font-size="10.5">packages/entitlements · packages/source-adapters · security/</text>
  <text x="348" y="556" fill="#7887A2" font-family="'JetBrains Mono', monospace" font-size="10">packages/config · OpenAPI Swagger UI (/docs)</text>

  <!-- Layer 3: Media Worker + Data & Storage -->
  <!-- Media Worker -->
  <rect x="784" y="92" width="300" height="240" rx="12" fill="#111520" stroke="#36D6D1" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="784" y="92" width="300" height="36" rx="12" fill="#181D2C"/>
  <rect x="784" y="116" width="300" height="12" fill="#181D2C"/>
  <text x="800" y="115" fill="#36D6D1" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">MEDIA EXECUTION · FFmpeg / Worker</text>

  <rect x="800" y="144" width="268" height="82" rx="8" fill="#181D2C" stroke="#2D354F"/>
  <text x="814" y="166" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600">FFmpeg / FFprobe Engine</text>
  <text x="814" y="186" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Direct CLI Spawn (API Queue)</text>
  <text x="814" y="203" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Standalone apps/media-worker (:3002)</text>
  <text x="814" y="219" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Remux · Transcode · Extract · Merge</text>

  <rect x="800" y="238" width="268" height="78" rx="8" fill="#181D2C" stroke="#2D354F"/>
  <text x="814" y="260" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600">Verification &amp; Scratch Quota</text>
  <text x="814" y="280" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Post-Render FFprobe Stream Check</text>
  <text x="814" y="297" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• SHA-256 Digest &amp; Scratch TTL Cleanup</text>

  <!-- Data & Storage -->
  <rect x="784" y="352" width="300" height="232" rx="12" fill="#111520" stroke="#23293D" stroke-width="1.5"/>
  <rect x="784" y="352" width="300" height="36" rx="12" fill="#181D2C"/>
  <rect x="784" y="376" width="300" height="12" fill="#181D2C"/>
  <text x="800" y="375" fill="#A59BFF" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">DATA &amp; OBJECT STORAGE</text>

  <rect x="800" y="404" width="268" height="76" rx="8" fill="#181D2C" stroke="#2D354F"/>
  <text x="814" y="426" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600">Relational Store (22 Tables)</text>
  <text x="814" y="446" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Local: Node 24 SQLite (WAL Mode)</text>
  <text x="814" y="463" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Prod: PostgreSQL Migration Schema</text>

  <rect x="800" y="492" width="268" height="76" rx="8" fill="#181D2C" stroke="#2D354F"/>
  <text x="814" y="514" fill="#F8FAFC" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600">Artifact &amp; Upload Storage</text>
  <text x="814" y="534" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Local Disk (.muxaro-uploads/artifacts)</text>
  <text x="814" y="551" fill="#9AA8BE" font-family="'Inter', system-ui, sans-serif" font-size="11.2">• Prod: Cloudflare R2 (SigV4) · 60m TTL</text>

  <!-- Connector Arrows -->
  <line x1="272" y1="210" x2="312" y2="210" stroke="#695BFF" stroke-width="2" marker-end="url(#arrow-indigo)"/>
  <line x1="312" y1="416" x2="274" y2="416" stroke="#36D6D1" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-cyan)"/>
  <text x="275" y="198" fill="#9AA8BE" font-family="'JetBrains Mono', monospace" font-size="9">REST</text>
  <text x="278" y="405" fill="#36D6D1" font-family="'JetBrains Mono', monospace" font-size="9">SSE</text>

  <line x1="740" y1="210" x2="780" y2="210" stroke="#36D6D1" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="740" y1="450" x2="780" y2="450" stroke="#9AA8BE" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <line x1="934" y1="332" x2="934" y2="348" stroke="#9AA8BE" stroke-width="2" marker-end="url(#arrow-slate)"/>
</svg>
