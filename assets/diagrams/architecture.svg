<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="MUXARO v2.0 Architecture Diagram">
  <defs>
    <style>
      .bg { fill: #0D0F14; }
      .panel { fill: #141821; stroke: #272E3F; stroke-width: 1.5; rx: 14; }
      .card { fill: #1A202C; stroke: #2F3950; stroke-width: 1.2; rx: 10; }
      .accentCard { fill: #18233C; stroke: #254EDB; stroke-width: 1.5; rx: 10; }
      .h1 { font: 700 15px 'Inter', system-ui, sans-serif; fill: #F4F6FA; letter-spacing: 0.4px; }
      .title { font: 600 13px 'Inter', system-ui, sans-serif; fill: #EEF2FF; }
      .sub { font: 400 11.5px 'Inter', system-ui, sans-serif; fill: #9BA5B7; }
      .tag { font: 600 10.5px 'JetBrains Mono', monospace; fill: #60A5FA; }
      .arrow { stroke: #4B5B7C; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
      .accentArrow { stroke: #3B82F6; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrBlue); }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 z" fill="#4B5B7C" />
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 z" fill="#3B82F6" />
    </marker>
  </defs>

  <rect width="960" height="440" class="bg" rx="16" />

  <!-- Column 1: Clients -->
  <rect x="28" y="28" width="250" height="384" class="panel" />
  <text x="46" y="56" class="h1">CLIENTS (SHARED STUDIO UI)</text>

  <rect x="46" y="76" width="214" height="86" class="card" />
  <text x="62" y="102" class="title">Web Studio (apps/web)</text>
  <text x="62" y="122" class="sub">Next.js 16 Static Bundle</text>
  <text x="62" y="142" class="tag">52 Tools · Browser WASM</text>

  <rect x="46" y="178" width="214" height="96" class="accentCard" />
  <text x="62" y="204" class="title">Windows Desktop (.exe)</text>
  <text x="62" y="224" class="sub">Electron 35 + Local Server</text>
  <text x="62" y="244" class="tag">FFmpeg · yt-dlp · LAN Mesh</text>

  <rect x="46" y="290" width="214" height="102" class="accentCard" />
  <text x="62" y="316" class="title">Android APK (apps/mobile)</text>
  <text x="62" y="336" class="sub">Capacitor 7 + Native Plugins</text>
  <text x="62" y="356" class="tag">MuxaroAi · MuxaroMedia</text>

  <!-- Column 2: Intelligence & Voice -->
  <rect x="336" y="28" width="286" height="384" class="panel" />
  <text x="354" y="56" class="h1">AI AGENT &amp; OFFLINE VOICE</text>

  <rect x="354" y="76" width="250" height="72" class="card" />
  <text x="370" y="100" class="title">Intent &amp; Workspace Memory</text>
  <text x="370" y="120" class="sub">Dictation reversals, Hinglish, ordinals,</text>
  <text x="370" y="136" class="sub">slot presets &amp; voice confirm gate</text>

  <rect x="354" y="162" width="250" height="72" class="accentCard" />
  <text x="370" y="186" class="title">Semantic Router + Hybrid RAG</text>
  <text x="370" y="206" class="sub">all-MiniLM-L6-v2 Q8 (WebGPU/WASM)</text>
  <text x="370" y="222" class="sub">BM25 + vector fusion, cited answers</text>

  <rect x="354" y="248" width="250" height="72" class="card" />
  <text x="370" y="272" class="title">100% Offline Voice &amp; Orb</text>
  <text x="370" y="292" class="sub">whisper.cpp + Piper Neural TTS (Win)</text>
  <text x="370" y="308" class="sub">On-Device SpeechRecognizer (Android)</text>

  <rect x="354" y="334" width="250" height="58" class="card" />
  <text x="370" y="358" class="title">Local / Cloud LLM Stream</text>
  <text x="370" y="376" class="sub">Ollama · LM Studio · PII-Masked BYOK SSE</text>

  <!-- Column 3: Execution Engines -->
  <rect x="680" y="28" width="252" height="384" class="panel" />
  <text x="698" y="56" class="h1">EXECUTION BACKENDS</text>

  <rect x="698" y="76" width="216" height="92" class="card" />
  <text x="714" y="102" class="title">In-Memory PDF Engine</text>
  <text x="714" y="122" class="sub">pdf-lib · pdfjs-dist · QPDF WASM</text>
  <text x="714" y="142" class="tag">Tesseract OCR · PII Burn-In</text>

  <rect x="698" y="184" width="216" height="96" class="accentCard" />
  <text x="714" y="210" class="title">Native Media Pipeline</text>
  <text x="714" y="230" class="sub">Out-of-process FFmpeg &amp; yt-dlp</text>
  <text x="714" y="250" class="tag">4K–12K · -c copy · 2-Pass MB</text>

  <rect x="698" y="296" width="216" height="96" class="card" />
  <text x="714" y="322" class="title">Self-Hosted API (Optional)</text>
  <text x="714" y="342" class="sub">apps/api Fastify 5 + media-worker</text>
  <text x="714" y="362" class="tag">SQLite WAL / Postgres · SSE</text>

  <!-- Connectors -->
  <path d="M278 120 L336 120" class="arrow" />
  <path d="M278 226 L336 226" class="accentArrow" />
  <path d="M278 340 L336 300" class="accentArrow" />

  <path d="M622 122 L680 122" class="arrow" />
  <path d="M622 284 L680 232" class="accentArrow" />
  <path d="M622 362 L680 344" class="arrow" />
</svg>
