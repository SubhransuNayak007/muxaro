<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" role="img" aria-label="MUXARO Mark">
  <title>MUXARO Brand Mark</title>
  <defs>
    <linearGradient id="mx-left" x1="88" y1="396" x2="210" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#695BFF"/>
      <stop offset="55%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4677FF"/>
    </linearGradient>
    <linearGradient id="mx-center" x1="176" y1="168" x2="336" y2="312" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B4FE8"/>
      <stop offset="50%" stop-color="#4677FF"/>
      <stop offset="100%" stop-color="#36D6D1"/>
    </linearGradient>
    <linearGradient id="mx-right" x1="290" y1="112" x2="432" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#36D6D1"/>
      <stop offset="52%" stop-color="#22B8CF"/>
      <stop offset="100%" stop-color="#4677FF"/>
    </linearGradient>
    <linearGradient id="mx-sheen" x1="116" y1="132" x2="274" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A59BFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#695BFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded Onyx Tile Base (subtle brand mark container) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#0A0D14"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="102.5" stroke="#23293D" stroke-width="3"/>

  <!-- Geometric Interlocking Stream Vectors forming M -->
  <g transform="translate(0, 6)">
    <!-- Left ingress vector -->
    <path d="M112 374 C98 374 88 360 93 346 L160 156 C168 132 191 116 216 118 C236 119 254 130 264 148 L302 214 L256 246 L218 184 C213 176 203 173 195 177 C188 180 183 188 180 197 L132 356 C128 367 121 374 112 374 Z" fill="url(#mx-left)"/>
    <!-- Subtle top-left vector highlight -->
    <path d="M160 156 C168 132 191 116 216 118 C230 119 243 125 253 134 C242 129 229 127 216 127 C196 127 177 140 170 160 L118 338 C113 352 104 358 96 355 L160 156 Z" fill="url(#mx-sheen)"/>
    <!-- Central multiplexing fold -->
    <path d="M180 197 C194 166 228 152 260 168 L314 198 L266 276 C252 296 224 300 204 286 L160 254 Z" fill="url(#mx-center)"/>
    <!-- Right unified output vector -->
    <path d="M256 246 L300 164 C314 136 342 118 374 120 C406 122 432 144 441 174 L484 328 C488 344 477 360 461 360 C452 360 444 354 440 344 L402 224 C397 208 384 196 368 196 C353 196 340 206 333 220 L292 294 C276 322 246 336 214 334 C194 332 176 322 164 307 L256 246 Z" fill="url(#mx-right)" transform="translate(-40, 14) scale(0.95)"/>
  </g>
</svg>
