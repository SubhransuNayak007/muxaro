<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Left Ribbon Gradient (Electric Violet -> Royal Blue) -->
    <linearGradient id="muxaro-left-grad" x1="120" y1="360" x2="220" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7B2FFE" />
      <stop offset="60%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Center Fold Gradient (Deep Blue -> Cyan) -->
    <linearGradient id="muxaro-center-grad" x1="180" y1="200" x2="330" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Right Ribbon Gradient (Cyan -> Signal Aquamarine) -->
    <linearGradient id="muxaro-right-grad" x1="280" y1="120" x2="400" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="40%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Shadow for depth -->
    <linearGradient id="muxaro-shadow-grad" x1="256" y1="180" x2="256" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0E17" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0B0E17" stop-opacity="0" />
    </linearGradient>

    <filter id="muxaro-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Soft Radial Glow -->
  <circle cx="256" cy="256" r="200" fill="#2563EB" opacity="0.08" filter="url(#muxaro-glow)" />

  <g id="muxaro-m-symbol">
    <!-- Back / Left Wing Facet -->
    <path d="M128 340 L196 172 C204 152 224 140 246 142 C262 144 278 156 288 174 L326 242 L280 274 L244 212 C238 202 226 196 214 200 C204 204 196 216 192 228 L152 328 C146 342 136 348 128 340 Z" fill="url(#muxaro-left-grad)" />

    <!-- Center Bridge & Deep Fold -->
    <path d="M192 228 C206 194 240 178 274 194 L326 220 L270 288 C256 304 232 308 214 296 L168 266 Z" fill="url(#muxaro-center-grad)" />

    <!-- Under-Fold Ambient Shadow -->
    <path d="M214 200 L288 174 L326 242 L270 288 Z" fill="url(#muxaro-shadow-grad)" />

    <!-- Foreground / 3D Ribbon Main Path (Continuous Flowing M) -->
    <path d="M142 348 C124 348 112 332 118 314 L170 170 C182 138 214 116 250 118 C276 120 298 134 314 156 L356 220 C368 238 388 248 408 244 C422 242 434 230 438 216 L448 186 C452 172 468 166 478 176 C488 186 486 202 480 216 L440 310 C428 338 400 356 368 354 C342 352 320 338 304 316 L262 254 C250 236 230 226 210 230 C194 234 182 248 178 264 L158 334 C154 344 148 348 142 348 Z" fill="url(#muxaro-right-grad)" />

    <!-- Left Wing Highlight Overlay -->
    <path d="M170 170 C182 138 214 116 250 118 C266 119 280 127 292 140 C280 132 264 128 248 128 C220 128 194 144 182 170 L132 308 C126 324 118 332 112 326 L170 170 Z" fill="#9065FE" opacity="0.6" />
  </g>
</svg>
