version: '3.9'

# ==============================================================================
# MUXARO Dedicated Media Worker - Docker Compose Manifest
# Wave 2: PO-Token Sidecar + Egress Router
#
# Services:
#   media-worker   - Main Fastify/Node.js app (port 3001 on host)
#   bgutil-sidecar - PO token provider, bound strictly to 127.0.0.1:4416
#   redis          - Internal only, no host port exposure
#
# All services on the internal 'media-net' bridge network.
# ==============================================================================

networks:
  media-net:
    driver: bridge
    internal: false   # media-worker needs outbound internet for yt-dlp

services:
  # ----------------------------------------------------------------------------
  # Main Media Worker (Fastify/Node.js)
  # ----------------------------------------------------------------------------
  media-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muxaro-media-worker
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - NODE_ENV=${NODE_ENV:-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-500}
      - MAX_CONCURRENT_STREAMS=${MAX_CONCURRENT_STREAMS:-5}
      - STREAM_TIMEOUT_SECONDS=${STREAM_TIMEOUT_SECONDS:-300}
      - PROBE_TIMEOUT_SECONDS=${PROBE_TIMEOUT_SECONDS:-8}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Redis (internal DNS via media-net)
      - REDIS_URL=redis://redis:6379/0
      # PO token sidecar – loopback only, guaranteed reachable inside container
      - BGUTIL_SIDECAR_URL=http://127.0.0.1:4416
      # Egress proxy list (comma-separated URLs; leave empty for direct)
      - EGRESS_PROXY_LIST=${EGRESS_PROXY_LIST:-}
      # Cloudflare R2
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-}
    depends_on:
      bgutil-sidecar:
        condition: service_started
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - media-net
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /app/temp:size=100M,uid=10001,gid=10001,mode=1777

  # ----------------------------------------------------------------------------
  # bgutil PO-Token Sidecar
  # Bound to 127.0.0.1:4416 only — NEVER exposed to external traffic.
  # The media-worker container must share the host network namespace OR use
  # network_mode: service:bgutil-sidecar to reach 127.0.0.1:4416.
  # Here we place it on media-net and expose it via a container-local alias
  # (the BGUTIL_SIDECAR_URL env may be overridden to http://bgutil-sidecar:4416
  # if network_mode sharing is not desired).
  # ----------------------------------------------------------------------------
  bgutil-sidecar:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: muxaro-bgutil-sidecar
    restart: unless-stopped
    # Bind strictly to loopback — never expose on 0.0.0.0
    ports:
      - "127.0.0.1:4416:4416"
    environment:
      - BIND_ADDRESS=127.0.0.1
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    networks:
      - media-net
    security_opt:
      - no-new-privileges:true

  # ----------------------------------------------------------------------------
  # Redis 7 (Alpine) — internal only, no host port exposed
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: muxaro-worker-redis
    restart: unless-stopped
    # Intentionally NO ports: block — Redis is accessible only within media-net
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:-muxaro_redis_secret}"
      - --bind
      - "0.0.0.0"
      - --protected-mode
      - "no"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-muxaro_redis_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - media-net
    security_opt:
      - no-new-privileges:true

volumes:
  redis_data:
