openapi: 3.1.0
info:
  title: MUXARO Media Processing API
  version: 1.0.0
  description: >
    Production REST & Server-Sent Events API for media inspection, conversion,
    audio extraction, video/audio multiplexing, and batch processing.
    Adheres to the MUXARO Authentic Fidelity Standard with strict zero fake upsampling.
servers:
  - url: http://localhost:4000/api/v1
    description: Local Development Server
  - url: https://api.muxaro.com/api/v1
    description: Production Cloud Edge

paths:
  /health:
    get:
      summary: System Health & Readiness Check
      description: Returns health status of API gateway, database connection, Redis cluster, and worker pool.
      operationId: getHealth
      responses:
        '200':
          description: All critical systems operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: One or more critical subsystems unhealthy

  /media/inspect:
    post:
      summary: Inspect Media URL
      description: >
        Inspects an external media URL through the SSRF-guarded Source Adapter layer.
        Returns authentic audio/video stream manifests, bitrates, true resolutions, and codecs.
      operationId: inspectMediaUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectRequest'
      responses:
        '200':
          description: Media successfully inspected and cached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectResponse'
        '400':
          description: Invalid URL format or unsupported protocol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: SSRF blocked or unauthorized target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /media/{id}:
    get:
      summary: Get Inspected Media Asset
      description: Retrieves previously inspected media manifest by asset ID from cache.
      operationId: getMediaAsset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Asset manifest retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectResponse'
        '404':
          description: Asset not found or cache expired

  /jobs:
    post:
      summary: Submit Media Processing Job
      description: >
        Enqueues an asynchronous processing job (audio extraction, stream-copy remux,
        resolution transcoding, or conversion). Atomically reserves quota against the
        user's rolling 24-hour window. Requires unique idempotencyKey.
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '202':
          description: Job admitted and enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '409':
          description: Quota exceeded or conflicting idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /jobs/{id}:
    get:
      summary: Poll Job Status
      description: Retrieves current execution status, progress percentage, error details, and download link.
      operationId: getJobById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job status returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '404':
          description: Job not found

  /jobs/{id}/events:
    get:
      summary: Stream Real-Time Job Progress (Server-Sent Events)
      description: >
        Opens a persistent SSE connection streaming progress events (0-100%),
        sub-phase transitions, encoding FPS, ETA, and terminal status (READY or FAILED).
      operationId: streamJobEvents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
                description: Continuous stream of JobProgressEvent JSON objects

  /jobs/{id}/cancel:
    post:
      summary: Cancel Running Job
      description: Emits cancellation signal to worker, terminates FFmpeg, cleans scratch files, and releases reserved quota.
      operationId: cancelJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job cancellation initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'

  /jobs/{id}/retry:
    post:
      summary: Retry Failed Job
      description: Re-enqueues a failed job if attempts remain under max limit.
      operationId: retryJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job re-enqueued

  /jobs/{id}/download:
    get:
      summary: Download Verified Artifact
      description: Returns 302 redirect to time-limited pre-signed S3 download URL or streams artifact directly.
      operationId: downloadJobArtifact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '302':
          description: Redirect to pre-signed S3 download URL
          headers:
            Location:
              schema:
                type: string
        '404':
          description: Output artifact not found or expired

  /tools/merge:
    post:
      summary: Submit Audio/Video Merge Job
      description: Multiplexes separate video and audio streams into a single synchronized container.
      operationId: submitMergeJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeJobRequest'
      responses:
        '202':
          description: Merge job enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'

  /playlists/inspect:
    post:
      summary: Inspect Playlist URL
      description: Discovers and inspects all child media items in a permitted playlist. Bounded to max 50 items.
      operationId: inspectPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectPlaylistRequest'
      responses:
        '200':
          description: Playlist inspected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistInspectResponse'

  /playlists/jobs:
    post:
      summary: Submit Playlist Batch Processing Job
      description: Submits batch processing job. Evaluated against 1 playlist job per 24h rolling allowance.
      operationId: createPlaylistJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaylistJobRequest'
      responses:
        '202':
          description: Playlist job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistJobStatusResponse'

  /account/credits:
    get:
      summary: Get Account Quota & Credits Balance
      description: >
        Returns remaining individual and playlist job allowances, active reservations,
        and dynamic rolling 24-hour reset countdown timers.
      operationId: getAccountCredits
      responses:
        '200':
          description: Quota details returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditsResponse'

  /account/history:
    get:
      summary: Get Job History
      description: Returns paginated history of jobs submitted by the user or guest session.
      operationId: getAccountHistory
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated history returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'

  /admin/metrics:
    get:
      summary: System Metrics & SRE Dashboard
      description: Admin-only endpoint returning queue depths, active worker count, error rates, and throughput.
      operationId: getAdminMetrics
      security:
        - AdminRole: []
      responses:
        '200':
          description: Real-time telemetry metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMetricsResponse'

components:
  securitySchemes:
    SessionAuth:
      type: apiKey
      in: cookie
      name: muxaro_session
    AdminRole:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      required: [success, data, requestId]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            status:
              type: string
              example: "HEALTHY"
            postgres:
              type: string
              example: "CONNECTED"
            redis:
              type: string
              example: "CONNECTED"
            workerPool:
              type: object
              properties:
                activeWorkers:
                  type: integer
                  example: 12
                totalSlots:
                  type: integer
                  example: 48
            version:
              type: string
              example: "1.0.0"
        requestId:
          type: string
          example: "req_018d96b1-4f12"

    InspectRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          example: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
        rightsDeclared:
          type: boolean
          default: true
          description: Affirmation of authorized personal/fair-use or content ownership

    InspectResponse:
      type: object
      required: [success, data, requestId]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            assetId:
              type: string
              format: uuid
            title:
              type: string
              example: "Big Buck Bunny 4K Sample"
            thumbnailUrl:
              type: string
              format: uri
            durationSeconds:
              type: number
              example: 596.5
            container:
              type: string
              example: "mp4"
            streams:
              type: array
              items:
                $ref: '#/components/schemas/MediaStreamItem'
            availableFormats:
              type: object
              properties:
                videoResolutions:
                  type: array
                  items:
                    type: string
                    example: "2160p"
                audioFormats:
                  type: array
                  items:
                    type: string
                    example: "mp3"
        requestId:
          type: string

    MediaStreamItem:
      type: object
      required: [index, type, codec]
      properties:
        index:
          type: integer
          example: 0
        type:
          type: string
          enum: [VIDEO, AUDIO, SUBTITLE]
          example: "VIDEO"
        codec:
          type: string
          example: "h264"
        width:
          type: integer
          example: 3840
        height:
          type: integer
          example: 2160
        bitrate:
          type: integer
          example: 18000000
        sampleRate:
          type: integer
          example: 48000
        channels:
          type: integer
          example: 2
        isNativeLossless:
          type: boolean
          example: true

    CreateJobRequest:
      type: object
      required: [mediaAssetId, operation, targetFormat, idempotencyKey]
      properties:
        mediaAssetId:
          type: string
          format: uuid
        operation:
          type: string
          enum: [EXTRACT_AUDIO, REMUX_STREAM_COPY, TRANSCODE_VIDEO, CONVERT_FORMAT]
          example: "REMUX_STREAM_COPY"
        targetFormat:
          type: string
          example: "mp4"
        targetResolution:
          type: string
          enum: [source, 4320p, 2160p, 1440p, 1080p, 720p, 480p, 360p]
          default: "source"
        targetAudioCodec:
          type: string
          enum: [copy, mp3, aac, opus, flac, wav]
          default: "copy"
        idempotencyKey:
          type: string
          example: "idem_910b83-a912-4c28"

    MergeJobRequest:
      type: object
      required: [videoAssetId, audioAssetId, targetFormat, idempotencyKey]
      properties:
        videoAssetId:
          type: string
          format: uuid
        audioAssetId:
          type: string
          format: uuid
        targetFormat:
          type: string
          example: "mp4"
        audioOffsetMs:
          type: integer
          default: 0
        idempotencyKey:
          type: string

    JobStatusResponse:
      type: object
      required: [success, data, requestId]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            jobId:
              type: string
              format: uuid
            status:
              type: string
              enum: [CREATED, VALIDATING, QUEUED, PROCESSING, VERIFYING, READY, FAILED, CANCELLED, EXPIRED]
              example: "PROCESSING"
            progress:
              type: number
              example: 45.2
            operation:
              type: string
              example: "REMUX_STREAM_COPY"
            downloadUrl:
              type: string
              format: uri
              nullable: true
            expiresAt:
              type: string
              format: date-time
              nullable: true
            error:
              type: object
              nullable: true
        requestId:
          type: string

    InspectPlaylistRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        maxItems:
          type: integer
          maximum: 50
          default: 50

    PlaylistInspectResponse:
      type: object
      required: [success, data, requestId]
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            title:
              type: string
            totalItems:
              type: integer
            items:
              type: array
              items:
                type: object
                properties:
                  position:
                    type: integer
                  title:
                    type: string
                  url:
                    type: string
                  durationSeconds:
                    type: number
        requestId:
          type: string

    CreatePlaylistJobRequest:
      type: object
      required: [playlistUrl, targetFormat, idempotencyKey]
      properties:
        playlistUrl:
          type: string
          format: uri
        targetFormat:
          type: string
          example: "mp4"
        targetResolution:
          type: string
          default: "1080p"
        packageAsZip:
          type: boolean
          default: true
        idempotencyKey:
          type: string

    PlaylistJobStatusResponse:
      type: object
      required: [success, data, requestId]
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            playlistJobId:
              type: string
              format: uuid
            status:
              type: string
              enum: [CREATED, QUEUED, PROCESSING, PACKAGING, COMPLETED, PARTIAL_FAILURE, FAILED]
            totalItems:
              type: integer
            completedItems:
              type: integer
            failedItems:
              type: integer
            zipDownloadUrl:
              type: string
              format: uri
              nullable: true
        requestId:
          type: string

    CreditsResponse:
      type: object
      required: [success, data, requestId]
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            individualVideos:
              type: object
              properties:
                allowance:
                  type: integer
                  example: 10
                consumed:
                  type: integer
                  example: 3
                remaining:
                  type: integer
                  example: 7
                windowSeconds:
                  type: integer
                  example: 86400
                nextResetAt:
                  type: string
                  format: date-time
                secondsUntilNextSlot:
                  type: integer
                  example: 14200
            playlists:
              type: object
              properties:
                allowance:
                  type: integer
                  example: 1
                consumed:
                  type: integer
                  example: 0
                remaining:
                  type: integer
                  example: 1
                maxItemsPerPlaylist:
                  type: integer
                  example: 50
                nextResetAt:
                  type: string
                  format: date-time
                  nullable: true
        requestId:
          type: string

    HistoryResponse:
      type: object
      required: [success, data, requestId]
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            limit:
              type: integer
            jobs:
              type: array
              items:
                $ref: '#/components/schemas/JobStatusResponse'
        requestId:
          type: string

    AdminMetricsResponse:
      type: object
      required: [success, data, requestId]
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            queue:
              type: object
              properties:
                waitingCount:
                  type: integer
                activeCount:
                  type: integer
                completedLastHour:
                  type: integer
                failedLastHour:
                  type: integer
            workerNodes:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  activeJobs:
                    type: integer
                  cpuPercent:
                    type: number
                  memoryMb:
                    type: number
            errorRates:
              type: object
              properties:
                fiveMinutePercent:
                  type: number
                topErrorCode:
                  type: string
        requestId:
          type: string

    ApiErrorResponse:
      type: object
      required: [success, error, requestId]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: "ERR_QUOTA_EXCEEDED"
            message:
              type: string
              example: "Individual video job quota exceeded for this 24-hour rolling window."
            details:
              type: object
              nullable: true
        requestId:
          type: string
          example: "req_018d96b1-4f12"
