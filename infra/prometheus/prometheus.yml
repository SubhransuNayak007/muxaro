# ==============================================================================
# MUXARO Production Prometheus Monitoring & Telemetry Configuration
# Scrapes Fastify API Gateway, Media Workers, Analyse Workers, and Data Stores
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    project: 'muxaro'
    environment: 'production'
    region: 'global'

# Alertmanager configuration (optional hooks for paging/alerts)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # ----------------------------------------------------------------------------
  # 1. Prometheus Self-Monitoring
  # ----------------------------------------------------------------------------
  - job_name: 'prometheus'
    metrics_path: '/metrics'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          tier: 'monitoring'
          service: 'prometheus'

  # ----------------------------------------------------------------------------
  # 2. Fastify REST & SSE API Gateway
  # Metrics: HTTP throughput, latency distributions, SSE connection count,
  #          Redis sliding-window rate limit triggers, active upload sessions
  # ----------------------------------------------------------------------------
  - job_name: 'muxaro-api'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['api:4000']
        labels:
          tier: 'api-gateway'
          service: 'fastify-api'
          lane: 'ingress'

  # ----------------------------------------------------------------------------
  # 3. Analyse Worker (BullMQ lane:analyse)
  # Metrics: Queue depths, proxy health scores, token bucket latency,
  #          upstream oEmbed response times, circuit breaker trip states
  # ----------------------------------------------------------------------------
  - job_name: 'muxaro-worker-analyse'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['worker-analyse:5001']
        labels:
          tier: 'worker'
          service: 'worker-analyse'
          lane: 'analyse'

  # ----------------------------------------------------------------------------
  # 4. Media Processing Worker (lane:fast-io, lane:transcode, lane:batch)
  # Metrics: FFmpeg execution duration, transcode speed factor, remux zero-copy
  #          ratio, Eco Mode CO2 savings, scratch disk utilization, heartbeat
  # ----------------------------------------------------------------------------
  - job_name: 'muxaro-worker-media'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['worker-media:5000']
        labels:
          tier: 'worker'
          service: 'worker-media'
          lanes: 'fast-io,transcode,batch'

  # ----------------------------------------------------------------------------
  # 5. Redis 7 Memory & BullMQ Queue Exporter (Optional sidecar exporter)
  # ----------------------------------------------------------------------------
  - job_name: 'muxaro-redis'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          tier: 'cache-broker'
          service: 'redis'

  # ----------------------------------------------------------------------------
  # 6. PostgreSQL 16 Exporter (Optional sidecar exporter)
  # ----------------------------------------------------------------------------
  - job_name: 'muxaro-postgres'
    metrics_path: '/metrics'
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          tier: 'database'
          service: 'postgresql'

  # ----------------------------------------------------------------------------
  # 7. KEDA Autoscaler Queue Metrics
  # ----------------------------------------------------------------------------
  - job_name: 'muxaro-keda'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['keda-operator-metrics:8080']
        labels:
          tier: 'autoscaling'
          service: 'keda'
