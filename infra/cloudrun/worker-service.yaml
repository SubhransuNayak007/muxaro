# ==============================================================================
# Google Cloud Run Service Specification — MUXARO Internal Media Worker
# Security: INGRESS=INTERNAL ONLY (NEVER exposed to public internet / allUsers)
# Cost Guardrails: minScale=0 (scale-to-zero), maxScale=2, concurrency=2
# Deploy: gcloud run services replace infra/cloudrun/worker-service.yaml --region=us-central1
# ==============================================================================
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: muxaro-worker
  labels:
    app.kubernetes.io/name: muxaro-worker
    app.kubernetes.io/part-of: muxaro
    muxaro.app/tier: worker
  annotations:
    # Internal-only ingress: reachable exclusively from authorized Cloud Run / VPC callers
    run.googleapis.com/ingress: internal
    run.googleapis.com/description: "MUXARO Stateless FFmpeg/yt-dlp Media Worker (internal-only, scale-to-zero)"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: muxaro-worker-sa@PROJECT_ID.iam.gserviceaccount.com
      # Strictly bound concurrent heavy FFmpeg transcodes per instance
      containerConcurrency: 2
      timeoutSeconds: 600
      containers:
        - name: muxaro-worker
          image: REGION-docker.pkg.dev/PROJECT_ID/muxaro/muxaro-worker:IMAGE_TAG
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: SCRATCH_DIR
              value: "/tmp/muxaro-scratch"
            - name: MAX_CONCURRENT_JOBS
              value: "2"
            - name: JOB_TIMEOUT_SECONDS
              value: "540"
            # Object storage credentials injected strictly via Google Secret Manager
            - name: R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: muxaro-r2-account-id
                  key: latest
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: muxaro-r2-access-key-id
                  key: latest
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: muxaro-r2-secret-access-key
                  key: latest
            - name: R2_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: muxaro-r2-bucket-name
                  key: latest
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
  traffic:
    - percent: 100
      latestRevision: true
