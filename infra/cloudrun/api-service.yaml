# ==============================================================================
# Google Cloud Run Service Specification — MUXARO Public REST & SSE API
# Cost Guardrails: minScale=0 (scale-to-zero), maxScale=2, bounded CPU/RAM
# Security: Non-root container, Secret Manager refs ONLY (zero literal secrets)
# Deploy: gcloud run services replace infra/cloudrun/api-service.yaml --region=us-central1
# ==============================================================================
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: muxaro-api
  labels:
    app.kubernetes.io/name: muxaro-api
    app.kubernetes.io/part-of: muxaro
    muxaro.app/tier: api
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/description: "MUXARO REST & SSE API Service (scale-to-zero, maxScale=2)"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: muxaro-api-sa@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - name: muxaro-api
          image: REGION-docker.pkg.dev/PROJECT_ID/muxaro/muxaro-api:IMAGE_TAG
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: TRUST_PROXY
              value: "true"
            - name: RATE_LIMIT_ENABLED
              value: "true"
            - name: CORS_ORIGIN
              value: "https://muxaro.app"
            - name: SITE_URL
              value: "https://muxaro.app"
            - name: FRONTEND_URL
              value: "https://muxaro.app"
            - name: BASE_URL
              value: "https://api.muxaro.app"
            - name: WORKER_CONCURRENCY
              value: "2"
            - name: MAX_PAYLOAD_BYTES
              value: "10485760"
            - name: STORAGE_DIR
              value: "/tmp/muxaro-scratch"
            - name: MUXARO_DB_PATH
              value: "/tmp/muxaro-data/muxaro.db"
            - name: REWARDED_ADS_ENABLED
              value: "false"
            # Secrets injected strictly from Google Secret Manager (never plaintext)
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: muxaro-session-secret
                  key: latest
            - name: SIGNED_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: muxaro-signed-token-secret
                  key: latest
            - name: MFA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: muxaro-mfa-encryption-key
                  key: latest
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: muxaro-database-url
                  key: latest
            - name: R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: muxaro-r2-account-id
                  key: latest
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: muxaro-r2-access-key-id
                  key: latest
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: muxaro-r2-secret-access-key
                  key: latest
            - name: R2_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: muxaro-r2-bucket-name
                  key: latest
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: muxaro-google-client-id
                  key: latest
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: muxaro-google-client-secret
                  key: latest
            - name: GOOGLE_REDIRECT_URI
              value: "https://api.muxaro.app/api/v1/auth/google/callback"
            - name: MUXARO_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: muxaro-admin-email
                  key: latest
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
  traffic:
    - percent: 100
      latestRevision: true
