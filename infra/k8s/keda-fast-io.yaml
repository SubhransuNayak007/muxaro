apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: keda-worker-media-fast-io
  namespace: muxaro
  labels:
    app.kubernetes.io/name: muxaro-worker-media
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: muxaro
    muxaro.com/lane: fast-io
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-media-fast-io
  # Fast I/O lane (remuxing, audio extraction, quick copies): lower latency, fast turnover
  minReplicaCount: 1
  maxReplicaCount: 20
  pollingInterval: 10
  cooldownPeriod: 120
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 4
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 120
          selectPolicy: Min
          policies:
            - type: Percent
              value: 20
              periodSeconds: 60
            - type: Pods
              value: 2
              periodSeconds: 60
  triggers:
    # Primary trigger: BullMQ waiting queue for lane:fast-io (Target Queue Depth: 10)
    - type: redis
      metadata:
        addressFromEnv: REDIS_URL
        listName: bull:lane:fast-io:wait
        targetListLength: "10"
        activationListLength: "1"
        enableDBIndex: "true"
        databaseIndex: "0"
    # Secondary trigger: BullMQ active processing set
    - type: redis
      metadata:
        addressFromEnv: REDIS_URL
        listName: bull:lane:fast-io:active
        targetListLength: "10"
        activationListLength: "1"
        enableDBIndex: "true"
        databaseIndex: "0"
