# ==============================================================================
# MUXARO Sandboxed Media Processing Worker (gVisor runsc + K8s Hardening)
#
# Threat Model Mitigations:
# 1. Container Escape / Kernel Exploit: runtimeClassName: gvisor (intercepts all
#    syscalls in userspace via Sentry kernel, preventing host kernel exploits).
# 2. Inbound Lateral Movement: ingress: [] (Zero inbound network attack surface).
# 3. SSRF & Cloud Metadata Exfiltration: Egress locked strictly to TCP 443,
#    strictly excluding RFC 1918, CGNAT, Loopback, and 169.254.0.0/16 (Cloud Metadata).
# 4. Filesystem Tampering & Persistence: readOnlyRootFilesystem: true, volatile
#    RAM-backed emptyDir at /sandbox (wiped on pod restart, zero disk traces).
# 5. Privilege Escalation & Host Identity: allowPrivilegeEscalation: false,
#    capabilities: drop: ["ALL"], automountServiceAccountToken: false, UID: 10001.
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-media-sandbox
  namespace: muxaro
  labels:
    app.kubernetes.io/name: muxaro-worker-media
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: muxaro
    app.kubernetes.io/instance: worker-media-sandbox
    muxaro.com/sandbox: gvisor
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: muxaro-worker-media
      app.kubernetes.io/component: worker
      muxaro.com/sandbox: gvisor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: muxaro-worker-media
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: muxaro
        muxaro.com/sandbox: gvisor
      annotations:
        container.apparmor.security.beta.kubernetes.io/worker-media: runtime/default
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
    spec:
      # Enforce Google gVisor user-space kernel sandbox (runsc)
      runtimeClassName: gvisor

      # Prevent mounting of Kubernetes ServiceAccount tokens (blocks cluster API enumeration)
      automountServiceAccountToken: false

      # Pod-level isolation & non-root user execution
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: worker-media
          image: muxaro/worker-media:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/index.js"]

          # Container-level privilege lockdown
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL

          # Resource boundaries to prevent CPU/memory exhaustion and transcode bombs
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
              ephemeral-storage: "8Gi"

          env:
            - name: NODE_ENV
              value: "production"
            - name: SANDBOX_RUNNER
              value: "gvisor"
            - name: SCRATCH_DIR
              value: "/sandbox"
            - name: TEMP_DIR
              value: "/sandbox/tmp"
            - name: MAX_CONCURRENT_JOBS
              value: "2"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: muxaro-secrets
                  key: redis-url
                  optional: true

          # Mount high-speed, volatile RAM-backed emptyDir scratch space
          volumeMounts:
            - name: sandbox-ram-scratch
              mountPath: /sandbox
            - name: tmp-ram-scratch
              mountPath: /tmp

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "test -d /sandbox"
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "test -d /sandbox"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

      # Volatile RAM-backed scratch mounts (tmpfs)
      volumes:
        - name: sandbox-ram-scratch
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: tmp-ram-scratch
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi

---
# ==============================================================================
# NetworkPolicy: Zero Ingress & Hardened Egress
#
# Rules:
# - Ingress: [] (Zero inbound connections allowed)
# - Egress: Only TCP port 443 to external public internet, strictly excluding:
#     * 10.0.0.0/8       (RFC 1918 Private)
#     * 172.16.0.0/12    (RFC 1918 Private)
#     * 192.168.0.0/16   (RFC 1918 Private)
#     * 169.254.0.0/16   (Cloud Metadata / Link-Local - e.g. 169.254.169.254)
#     * 100.64.0.0/10    (Carrier-Grade NAT)
#     * 127.0.0.0/8      (IPv4 Loopback)
#   Plus internal cluster DNS (port 53) and Redis broker (port 6379).
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-media-sandbox-netpol
  namespace: muxaro
  labels:
    app.kubernetes.io/name: muxaro-worker-media
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: muxaro
    muxaro.com/sandbox: gvisor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: muxaro-worker-media
      muxaro.com/sandbox: gvisor

  policyTypes:
    - Ingress
    - Egress

  # Strictly zero inbound traffic permitted
  ingress: []

  egress:
    # 1. In-Cluster DNS Resolution (kube-dns / CoreDNS)
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # 2. In-Cluster Redis Queue Broker
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379

    # 3. Public External Internet: Strictly HTTPS (TCP 443) only.
    #    Blocks all internal VPC CIDRs, CGNAT, Loopback, and Cloud Instance Metadata (169.254.169.254).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8        # RFC 1918 Private Network
              - 172.16.0.0/12     # RFC 1918 Private Network
              - 192.168.0.0/16    # RFC 1918 Private Network
              - 169.254.0.0/16    # IPv4 Link-Local & Cloud Metadata (169.254.169.254)
              - 100.64.0.0/10     # RFC 6598 Carrier-Grade NAT (CGNAT)
              - 127.0.0.0/8       # IPv4 Loopback
              - 0.0.0.0/8         # "This" network (RFC 1122)
              - 192.0.0.0/24      # IETF Protocol Assignments (RFC 6890)
              - 192.0.2.0/24      # TEST-NET-1 (RFC 5737)
              - 198.51.100.0/24   # TEST-NET-2 (RFC 5737)
              - 203.0.113.0/24    # TEST-NET-3 (RFC 5737)
              - 224.0.0.0/4       # Multicast
              - 240.0.0.0/4       # Reserved for future use
      ports:
        - protocol: TCP
          port: 443
