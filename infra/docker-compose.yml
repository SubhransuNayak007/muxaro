# ==============================================================================
# MUXARO Local & Staging Orchestration Environment
# Fully orchestrated: Next.js Web, Fastify API, FFmpeg Media Worker,
# PostgreSQL 16, Redis 7, MinIO (S3 Object Store)
# ==============================================================================

version: '3.9'

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  data-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  scratch_data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # Database Tier: PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: muxaro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-muxaro_db}
      POSTGRES_USER: ${POSTGRES_USER:-muxaro_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muxaro_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-muxaro_user} -d ${POSTGRES_DB:-muxaro_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # In-Memory Cache & Message Broker: Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: muxaro-redis
    restart: unless-stopped
    command: >
      redis-server 
      --appendonly yes 
      --requirepass ${REDIS_PASSWORD:-muxaro_redis_secret} 
      --maxmemory 512mb 
      --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-muxaro_redis_secret}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # ----------------------------------------------------------------------------
  # S3-Compatible Object Storage: MinIO
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: muxaro-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Automated MinIO Bucket Initializer
  minio-init:
    image: minio/mc:latest
    container_name: muxaro-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./scripts/init-minio.sh:/init-minio.sh:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    networks:
      - data-net

  # ----------------------------------------------------------------------------
  # API Tier: Fastify REST Service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: muxaro-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-muxaro_user}:${POSTGRES_PASSWORD:-muxaro_secure_password}@postgres:5432/${POSTGRES_DB:-muxaro_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-muxaro_redis_secret}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_UPLOADS: muxaro-uploads
      S3_BUCKET_ARTIFACTS: muxaro-artifacts
      S3_FORCE_PATH_STYLE: "true"
      MEDIA_WORKER_URL: http://media-worker:5000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "${API_PORT:-4000}:4000"
    networks:
      - frontend-net
      - backend-net
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:4000/health || curl -f http://127.0.0.1:4000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Media Processing Tier: FFmpeg Worker
  # ----------------------------------------------------------------------------
  media-worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.media
    container_name: muxaro-media-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - scratch_data:/tmp/muxaro-scratch
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      HOST: 0.0.0.0
      SCRATCH_DIR: /tmp/muxaro-scratch
      DATABASE_URL: postgres://${POSTGRES_USER:-muxaro_user}:${POSTGRES_PASSWORD:-muxaro_secure_password}@postgres:5432/${POSTGRES_DB:-muxaro_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-muxaro_redis_secret}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_UPLOADS: muxaro-uploads
      S3_BUCKET_ARTIFACTS: muxaro-artifacts
      S3_FORCE_PATH_STYLE: "true"
      MAX_CONCURRENT_JOBS: 4
      JOB_TIMEOUT_SECONDS: 120
    ports:
      - "${MEDIA_WORKER_PORT:-5000}:5000"
    networks:
      - backend-net
      - data-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Frontend Web Tier: Next.js 14
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: muxaro-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://api:4000
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/health || curl -f http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
