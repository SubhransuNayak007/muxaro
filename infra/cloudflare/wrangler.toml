name = "muxaro-download-worker"
main = "download-worker.ts"
compatibility_date = "2024-05-01"
compatibility_flags = ["nodejs_compat"]

# Isolated Edge Download Domain Routing
routes = [
  { pattern = "download.muxaro-usercontent.com/*", zone_name = "muxaro-usercontent.com" },
  { pattern = "*.muxaro-usercontent.com/*", zone_name = "muxaro-usercontent.com" }
]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "muxaro-artifacts"

[vars]
ALLOWED_ORIGIN = "*"
USERCONTENT_DOMAIN = "muxaro-usercontent.com"
